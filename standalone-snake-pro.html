<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SNAKE PRO – Ultimate Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05070f;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-orbitron { font-family: 'Orbitron', monospace; }
    .arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 8px;
    }
    .hud-title { font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: #10b981; text-transform: uppercase; }
    .hud-val { font-size: 20px; font-weight: bold; font-family: 'Orbitron', monospace; color: #34d399; }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
      background: #080d1a;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }
    .btn {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #050814;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.1em;
      border: none;
      padding: 12px 32px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(16, 185, 129, 0.8); }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 8px;
      cursor: pointer;
    }
    .diff-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
    }
    .diff-btn.active {
      background: #10b981;
      color: #050814;
      font-weight: bold;
      border-color: #10b981;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      gap: 6px;
      margin-top: 12px;
    }
    .dpad button {
      height: 48px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .dpad button:active { background: #10b981; color: #000; }
  </style>
</head>
<body>
  <div class="arcade-wrapper">
    <div class="hud">
      <div>
        <div class="hud-title">SCORE</div>
        <div id="scoreDisplay" class="hud-val">0</div>
      </div>
      <div>
        <div class="hud-title" style="color: #94a3b8;">LEVEL</div>
        <div id="levelDisplay" class="hud-val" style="color: #f8fafc;">1</div>
      </div>
      <div style="text-align: right;">
        <div class="hud-title" style="color: #fbbf24;">BEST</div>
        <div id="highScoreDisplay" class="hud-val" style="color: #fbbf24;">0</div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <!-- Main Menu Overlay -->
      <div id="menuOverlay" class="overlay">
        <h1 class="font-orbitron" style="font-size: 36px; font-weight: 900; color: #34d399; text-shadow: 0 0 20px rgba(52,211,153,0.8); margin-bottom: 4px;">SNAKE PRO</h1>
        <p style="font-size: 12px; letter-spacing: 0.2em; color: #94a3b8; text-transform: uppercase; margin-bottom: 24px;">Ultimate Edition</p>
        
        <button id="startBtn" class="btn">PLAY NOW</button>

        <div style="margin-top: 20px; display: flex; gap: 6px;">
          <button class="diff-btn" data-diff="EASY">EASY</button>
          <button class="diff-btn active" data-diff="MEDIUM">MEDIUM</button>
          <button class="diff-btn" data-diff="HARD">HARD</button>
          <button class="diff-btn" data-diff="EXPERT">EXPERT</button>
        </div>

        <p style="margin-top: 20px; font-size: 12px; color: #64748b;">Arrow keys or WASD to move · P to Pause</p>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay" style="display: none;">
        <h2 class="font-orbitron" style="font-size: 32px; font-weight: 900; color: #f43f5e; margin-bottom: 8px;">GAME OVER</h2>
        <div style="background: #0f172a; padding: 12px 24px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 16px; text-align: center;">
          <div style="font-size: 11px; color: #94a3b8;">FINAL SCORE</div>
          <div id="finalScore" class="hud-val" style="font-size: 32px; color: #34d399;">0</div>
        </div>
        <button id="restartBtn" class="btn">TRY AGAIN</button>
        <button id="mainMenuBtn" class="btn-secondary">MAIN MENU</button>
      </div>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="overlay" style="display: none;">
        <h2 class="font-orbitron" style="font-size: 28px; font-weight: 900; color: #38bdf8; margin-bottom: 16px;">PAUSED</h2>
        <button id="resumeBtn" class="btn">RESUME</button>
        <button id="pauseRestartBtn" class="btn-secondary">RESTART</button>
      </div>
    </div>

    <!-- Mobile Virtual Controls -->
    <div class="dpad">
      <div></div>
      <button id="btnUp">▲</button>
      <div></div>
      <button id="btnLeft">◀</button>
      <button id="btnPause" style="font-size: 12px;">II</button>
      <button id="btnRight">▶</button>
      <div></div>
      <button id="btnDown">▼</button>
      <div></div>
    </div>
  </div>

  <script>
    (function() {
      const GRID = 24;
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const CELL = canvas.width / GRID;

      // Audio Synthesis
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, type, duration, vol) {
        if (!audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }

      function soundEat() { playTone(600, 'sine', 0.1, 0.25); }
      function soundDie() { playTone(120, 'sawtooth', 0.4, 0.35); }
      function soundStart() { playTone(880, 'triangle', 0.2, 0.3); }

      let state = 'menu';
      let difficulty = 'MEDIUM';
      const speeds = { EASY: 130, MEDIUM: 100, HARD: 75, EXPERT: 55 };
      let snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
      let dir = 'RIGHT';
      let nextDir = 'RIGHT';
      let food = {x: 18, y: 12, type: 'apple'};
      let score = 0;
      let level = 1;
      let highScore = parseInt(localStorage.getItem('snakepro_hs_' + difficulty) || '0');
      let gameInterval = null;
      let particles = [];

      document.getElementById('highScoreDisplay').innerText = highScore;

      function spawnFood() {
        let openCells = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!snake.some(s => s.x === x && s.y === y)) openCells.push({x, y});
          }
        }
        if (openCells.length === 0) return;
        const p = openCells[Math.floor(Math.random() * openCells.length)];
        food = { x: p.x, y: p.y, type: Math.random() < 0.2 ? 'gold' : 'apple' };
      }

      function startGame() {
        soundStart();
        snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
        dir = 'RIGHT';
        nextDir = 'RIGHT';
        score = 0;
        level = 1;
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('levelDisplay').innerText = level;
        spawnFood();
        state = 'playing';
        document.getElementById('menuOverlay').style.display = 'none';
        document.getElementById('gameOverOverlay').style.display = 'none';
        document.getElementById('pauseOverlay').style.display = 'none';
        clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, speeds[difficulty]);
      }

      function gameStep() {
        if (state !== 'playing') return;
        dir = nextDir;
        const head = { ...snake[0] };
        if (dir === 'UP') head.y--;
        else if (dir === 'DOWN') head.y++;
        else if (dir === 'LEFT') head.x--;
        else if (dir === 'RIGHT') head.x++;

        // Wall Collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();

        // Self Collision
        if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

        snake.unshift(head);

        // Check Food
        if (head.x === food.x && head.y === food.y) {
          soundEat();
          const pts = food.type === 'gold' ? 30 : 10;
          score += pts;
          level = Math.floor(score / 60) + 1;
          document.getElementById('scoreDisplay').innerText = score;
          document.getElementById('levelDisplay').innerText = level;

          // Particles
          for (let i = 0; i < 16; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 3 + 1;
            particles.push({
              x: (food.x + 0.5) * CELL,
              y: (food.y + 0.5) * CELL,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              color: food.type === 'gold' ? '#fbbf24' : '#ef4444',
              life: 1
            });
          }

          if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakepro_hs_' + difficulty, highScore);
            document.getElementById('highScoreDisplay').innerText = highScore;
          }
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function gameOver() {
        soundDie();
        state = 'gameover';
        clearInterval(gameInterval);
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverOverlay').style.display = 'flex';
      }

      function togglePause() {
        if (state === 'playing') {
          state = 'paused';
          document.getElementById('pauseOverlay').style.display = 'flex';
        } else if (state === 'paused') {
          state = 'playing';
          document.getElementById('pauseOverlay').style.display = 'none';
        }
      }

      // Render Loop
      function draw() {
        ctx.fillStyle = '#080d1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid lines
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        // Draw Food
        const fx = (food.x + 0.5) * CELL;
        const fy = (food.y + 0.5) * CELL;
        ctx.fillStyle = food.type === 'gold' ? '#fbbf24' : '#ef4444';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(fx, fy, CELL * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Snake
        snake.forEach((seg, i) => {
          const sx = (seg.x + 0.5) * CELL;
          const sy = (seg.y + 0.5) * CELL;
          ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
          ctx.shadowColor = 'rgba(34, 197, 94, 0.8)';
          ctx.shadowBlur = i === 0 ? 16 : 8;
          ctx.beginPath();
          ctx.arc(sx, sy, CELL * 0.42, 0, Math.PI * 2);
          ctx.fill();

          // Connect segments
          if (i < snake.length - 1) {
            const next = snake[i + 1];
            if (Math.abs(seg.x - next.x) <= 1 && Math.abs(seg.y - next.y) <= 1) {
              ctx.strokeStyle = ctx.fillStyle;
              ctx.lineWidth = CELL * 0.8;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.lineTo((next.x + 0.5) * CELL, (next.y + 0.5) * CELL);
              ctx.stroke();
            }
          }
        });
        ctx.shadowBlur = 0;

        // Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.04;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') { if (dir !== 'DOWN') nextDir = 'UP'; }
        else if (k === 'arrowdown' || k === 's') { if (dir !== 'UP') nextDir = 'DOWN'; }
        else if (k === 'arrowleft' || k === 'a') { if (dir !== 'RIGHT') nextDir = 'LEFT'; }
        else if (k === 'arrowright' || k === 'd') { if (dir !== 'LEFT') nextDir = 'RIGHT'; }
        else if (k === 'p' || k === 'escape') { togglePause(); }
        else if (k === 'r') { if (state === 'playing') startGame(); }
        else if (e.code === 'Space') { if (state === 'menu' || state === 'gameover') startGame(); }
      });

      // UI Listeners
      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('restartBtn').addEventListener('click', startGame);
      document.getElementById('resumeBtn').addEventListener('click', togglePause);
      document.getElementById('pauseRestartBtn').addEventListener('click', startGame);
      document.getElementById('mainMenuBtn').addEventListener('click', () => {
        state = 'menu';
        document.getElementById('gameOverOverlay').style.display = 'none';
        document.getElementById('menuOverlay').style.display = 'flex';
      });

      // Difficulty buttons
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          difficulty = btn.dataset.diff;
          highScore = parseInt(localStorage.getItem('snakepro_hs_' + difficulty) || '0');
          document.getElementById('highScoreDisplay').innerText = highScore;
        });
      });

      // D-Pad
      document.getElementById('btnUp').onclick = () => { if (dir !== 'DOWN') nextDir = 'UP'; };
      document.getElementById('btnDown').onclick = () => { if (dir !== 'UP') nextDir = 'DOWN'; };
      document.getElementById('btnLeft').onclick = () => { if (dir !== 'RIGHT') nextDir = 'LEFT'; };
      document.getElementById('btnRight').onclick = () => { if (dir !== 'LEFT') nextDir = 'RIGHT'; };
      document.getElementById('btnPause').onclick = togglePause;
    })();
  </script>
</body>
</html>
